<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NEON.DOC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%230b0118%27/%3E%3Crect x=%273%27 y=%273%27 width=%2710%27 height=%2710%27 fill=%27none%27 stroke=%27%23ff2e88%27 stroke-width=%272%27/%3E%3C/svg%3E">
</head>
<body>
<div class="crt"></div>
<div class="app">
  <aside class="side">
    <a class="logo" href="#/gallery">
      <span class="logo-main" data-text="NEON.DOC">NEON.DOC</span>
      <span class="logo-sub" id="logoSub">LOCAL QWEN // REPORT FACTORY</span>
    </a>
    <nav class="nav">
      <a href="#/gallery" data-nav="gallery"><i>◆</i>Шаблоны</a>
      <a href="#/works" data-nav="works"><i>▤</i>Работы</a>
      <a href="#/files" data-nav="files"><i>▣</i>Хранилище</a>
      <a href="#/transcribe" data-nav="transcribe"><i>♪</i>Расшифровка</a>
      <a href="#/annot" data-nav="annot"><i>▢</i>Разметка</a>
      <a href="#/chat" data-nav="chat"><i>✦</i>Чат с Qwen</a>
      <a href="#/settings" data-nav="settings"><i>⚙</i>Настройки</a>
    </nav>
    <div class="side-sun"></div>
    <button class="theme-quick" id="themeQuick" title="Сменить оформление"><span id="themeQuickIc">☼</span><span id="themeQuickTx">Тема</span></button>
    <div class="leds" id="leds">
      <div class="led" data-led="ollama"><b></b>OLLAMA</div>
      <div class="led" data-led="model"><b></b><span>MODEL</span></div>
      <div class="led" data-led="whisper"><b></b>WHISPER</div>
      <div class="led" data-led="mic"><b></b>MIC</div>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>

<section class="console" id="console">
  <header class="console-bar">
    <span class="rec"><b></b><span id="jobTitle">IDLE</span></span>
    <span class="vt" id="jobTime">00:00</span>
    <span class="grow"></span>
    <button class="btn tiny ghost" id="jobStop">■ СТОП</button>
    <button class="btn tiny ghost" id="consoleToggle">▲</button>
  </header>
  <pre class="console-log" id="jobLog"></pre>
</section>

<div class="toasts" id="toasts"></div>
<div class="modal-back" id="modal"></div>
<script src="/static/themes.js"></script>
<script src="/static/annot.js"></script>
<script src="/static/app.js"></script>
<script src="/static/views.js"></script>
<script src="/static/wdocs.js"></script>
</body>
</html>
